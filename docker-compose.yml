services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mountain_store
      POSTGRES_USER: mountain_store
      POSTGRES_PASSWORD: mountain_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mountain_store", "-d", "mountain_store"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
